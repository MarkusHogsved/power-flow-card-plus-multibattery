<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Power Flow Card Plus multibattery icon: three batteries at different
       charge levels joined by one power-flow line. Same tile style as the
       other MarkusHogsved HACS repos (LoadCast). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E3B57"/>
      <stop offset="1" stop-color="#0F7C77"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- Power flow line with dots -->
  <path d="M120 128 H392" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="12" stroke-linecap="round"/>
  <path d="M120 128 V170 M256 128 V170 M392 128 V170" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="12" stroke-linecap="round"/>
  <circle cx="188" cy="128" r="13" fill="#FFB547"/>
  <circle cx="324" cy="128" r="13" fill="#FFB547"/>

  <!-- Battery outlines (caps on top) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round">
    <rect x="76"  y="186" width="88" height="220" rx="18"/>
    <rect x="212" y="186" width="88" height="220" rx="18"/>
    <rect x="348" y="186" width="88" height="220" rx="18"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="100" y="170" width="40" height="16" rx="5"/>
    <rect x="236" y="170" width="40" height="16" rx="5"/>
    <rect x="372" y="170" width="40" height="16" rx="5"/>
  </g>

  <!-- Charge levels: high (amber), medium (teal), low (purple) -->
  <rect x="94"  y="226" width="52" height="162" rx="8" fill="#FFB547"/>
  <rect x="230" y="288" width="52" height="100" rx="8" fill="#4DB6AC"/>
  <rect x="366" y="340" width="52" height="48"  rx="8" fill="#A280DB"/>
</svg>
